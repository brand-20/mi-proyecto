# Configuración de ruff para proyectos de cálculo: copiar a la raíz del proyecto.
# N802/N803/N806/N815/N816 se desactivan para permitir la notación de la norma
# (M_u, As, Vc, w_CM).
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "UP", "I", "N"]
ignore = ["N802", "N803", "N806", "N815", "N816"]

[lint.isort]
known-first-party = ["civil"]
